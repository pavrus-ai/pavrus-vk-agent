name: pavrus-vk-agent

on:
  schedule:
    # Запуск каждый день в 10:00 МСК (07:00 UTC)
    - cron: '0 7 * * *'
  workflow_dispatch:  # Ручной запуск кнопкой

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run agent
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIGACHAT_CLIENT_ID1: ${{ secrets.GIGACHAT_CLIENT_ID1 }}
          GIGACHAT_CLIENT_SECRET1: ${{ secrets.GIGACHAT_CLIENT_SECRET1 }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GROQ_KEY2: ${{ secrets.GROQ_KEY2 }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          OPENROUTER_KEY2: ${{ secrets.OPENROUTER_KEY2 }}
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_KEY }}
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python agent.py

      - name: Commit updated history
        run: |
          git config user.name "pavrus-agent"
          git config user.email "agent@pavrus.ru"
          git add history_vk.json sitemap_cache.json
          git diff --cached --quiet || git commit -m "Auto-update history"
          git push
