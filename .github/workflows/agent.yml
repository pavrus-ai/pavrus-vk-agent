name: pavrus-vk-agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VK_TOKEN: ${{ secrets.VK_TOKEN }}
      VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
      VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GROQ_KEY: ${{ secrets.GROQ_KEY }}
      OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Запуск агента
        run: python agent.py
      - name: Сохранить историю
        run: |
          git config user.name "pavrus-agent"
          git config user.email "agent@users.noreply.github.com"
          git add history.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "history update"; git push; }
