name: Pavrus Dzen Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

jobs:
  pavrus-dzen:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run Pavrus Dzen agent
        run: python pavrus_dzen_agent.py
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GROQ_KEY2: ${{ secrets.GROQ_KEY2 }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          OPENROUTER_KEY2: ${{ secrets.OPENROUTER_KEY2 }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_DZEN_CHANNEL: ${{ secrets.TELEGRAM_DZEN_CHANNEL }}

      - name: Commit history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update history [skip ci]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
